[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "coverageproof"
version = "0.1.0"
description = "Evidence-backed assessment coverage and constrained planning"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "jinja2>=3.1.6,<4", "python-multipart>=0.0.20,<1", "defusedxml>=0.7.1,<1", "httpx>=0.28,<1", "reportlab>=4,<5"]
[project.optional-dependencies]
test = ["pytest>=8,<10", "pypdf>=5,<7"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.setuptools.packages.find]
include = ["coverageproof*"]
[tool.setuptools.package-data]
coverageproof = ["templates/*.html"]
